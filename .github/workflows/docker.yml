name: docker

# 镜像由 CI 构建（本机 docker.io 不通，不适合拿部署机当构建机）。
# 触发：main 分支推送 / 版本 tag / 手动。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}       # ghcr.io/argszero/papershelf

jobs:
  # ───────────────────────────────────────────────────────────────
  # 1｜离线回归（不联网、不调 LLM）—— 镜像只在这些测试通过后才构建
  # ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 离线回归测试
        run: pytest tests -q

      # 前端在 CI 里也构建一次：`npm run build` 含 `tsc -b`，
      # 类型错误必须在这里就暴露，而不是等出现"前端尚未构建"的降级页
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端（含类型检查）
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f ../src/papershelf/static/index.html

  # ───────────────────────────────────────────────────────────────
  # 2｜按架构并行构建，各自 **原生** 编译，按 digest 推送
  #
  # ⚠️ 为什么不用单 job + `platforms: linux/amd64,linux/arm64`（踩过）：
  #    那样 arm64 会在 x86 机器上跑 QEMU 模拟，于是 `npm ci` / `npm run build` /
  #    `pip install` 全在模拟 CPU 上执行 —— 实测单步 191s，web 阶段 4/6 就烧掉 40+ 分钟
  #    （Python 阶段还没开始）。改成两个原生 runner 并行后，两边都真跑，
  #    不必依赖缓存运气，也把最慢的环节从串行模拟变成并行原生。
  #
  # 公开仓库用 arm64 runner **免费**（`ubuntu-24.04-arm`）。
  # 若该标签在你的账号下不可用（job 会快速失败："no runner matching"），
  # 把 arm64 那条 matrix 项改回 `runs-on: ubuntu-latest` + 加回
  # docker/setup-qemu-action 即退化为旧的模拟构建（慢，但能出多架构镜像）。
  # ───────────────────────────────────────────────────────────────
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false        # 一个架构失败也让另一个跑完，便于看清是"全挂"还是"单单 arm 挂"
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 平台信息（用于缓存 scope / artifact 名）
        run: echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 OCI 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: 构建并按 digest 推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # 先不落 tag，只按 digest 推；等两个架构都好了再由 merge job 合成 manifest list。
          # 这样"latest"永远不会指向一个只有单架构的半成品镜像。
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # 缓存必须**按平台分 scope**：两个平台共用 scope 会互相覆盖、缓存失效
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          # digest 形如 sha256:abc…，命名为纯 hash 供后面 imagetools 拼 @sha256:<file>
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          ls -l /tmp/digests/

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────────
  # 3｜把各架构的 digest 合成 manifest list，并打上全部 tag
  #    （拉 `:latest` 时 Docker 会按当前机器自动选对应架构的那份）
  # ───────────────────────────────────────────────────────────────
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: 下载各架构 digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: 生成标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合成 manifest list 并推送
        working-directory: /tmp/digests
        run: |
          # 用数组而不是 $(...) 拼接：标签和 digest 都是"多个参数"，
          # 未加引号的命令替换会被 shellcheck 判为 SC2046（也确实容易在含空格时出错）
          tags=()
          while IFS= read -r t; do tags+=("-t" "$t"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          refs=()
          for f in *; do refs+=("ghcr.io/${GITHUB_REPOSITORY}@sha256:${f}"); done

          printf '标签：%s\n' "${tags[*]}"
          printf '架构：%s\n' "${refs[*]}"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: 校验多架构确实到位
        run: |
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}:latest"

      - name: 摘要
        run: |
          {
            echo "### 镜像已推送（多架构）"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              | sed -n '/Manifests:/,$p'
            echo '```'
            echo
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────
  # 4｜把合成好的镜像**真起一次**并断言可用
  #
  # M4 的验收标准是"一条命令起服务"，那就必须真的起一遍 —— 而不是只看构建成功。
  # 这一环专门抓"镜像构建成功但装的东西不对"这类问题，例如：
  #   · 多阶段构建忘了把前端产物 COPY 进去（镜像里没有 index.html）
  #   · 入口脚本的护栏被改坏（缺 SECRET 也能起来 = 生产会静默用不安全默认值）
  #   · 数据目录/属主不对导致启动即退出
  # 本地 docker.io / ghcr.io 都不通，所以这一步只能在 CI 里做。
  # ───────────────────────────────────────────────────────────────
  smoke:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      # ⚠️ 这里不能用 `${{ env.REGISTRY }}` —— 定义 job 的 env 时 `env` 上下文还不可用
      #    （可用的是 github/inputs/matrix/needs/secrets/strategy/vars），会被判为
      #    "workflow file issue" 直接秒失败，且报错信息只有一句 "This run likely failed
      #    because of a workflow file issue"。本地用 actionlint 才能看到真正原因。
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 缺 SECRET 必须启动即失败（不静默用不安全默认值）
        run: |
          if docker run --rm "$IMAGE" true; then
            echo "::error::未设 PAPERSHELF_SECRET 竟然启动成功了 —— 入口护栏失效"
            exit 1
          fi
          echo "✅ 缺 SECRET 被拦下"

      - name: 给了邮箱却没给密码，也必须启动即失败
        run: |
          if docker run --rm -e PAPERSHELF_SECRET=abcdefghijklmnopqrstuvwxyz123456 \
               -e PAPERSHELF_ADMIN_EMAIL=a@b.edu.cn "$IMAGE" true; then
            echo "::error::管理员邮箱与密码不成对，竟然启动成功了"
            exit 1
          fi
          echo "✅ 管理员密码缺失被拦下"

      - name: 正常路径起容器
        run: |
          docker run -d --name ps-smoke -p 8000:8000 \
            -e PAPERSHELF_SECRET="$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')" \
            -e PAPERSHELF_ADMIN_EMAIL=admin@smoke.edu.cn \
            -e PAPERSHELF_ADMIN_PASSWORD=smoketest123 \
            -e PAPERSHELF_BASE_URL=http://127.0.0.1:8000 \
            -v ps-smoke-data:/data \
            "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: /api/health 必须 ok
        run: |
          body=$(curl -fsS http://127.0.0.1:8000/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'

      - name: 镜像里必须**真的有前端产物**（多阶段构建的实质）
        run: |
          # 没有构建产物时后端返回的是「前端尚未构建」JSON 降级页 —— 这条能抓住
          # "镜像构建成功但忘了 COPY 前端" 的情况（本地因恰好 build 过而测不出）
          curl -fsS http://127.0.0.1:8000/ | tee /tmp/index.html
          grep -qi 'id="root"' /tmp/index.html
          echo "✅ 前端 SPA 已随镜像分发"

      - name: 容器健康检查最终要转 healthy
        run: |
          for _ in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ps-smoke)
            echo "health=$status"
            [ "$status" = healthy ] && exit 0
            sleep 5
          done
          echo "::error::容器始终未变为 healthy"; exit 1

      - name: 数据落在卷里（重启不丢）
        run: |
          docker exec ps-smoke ls -l /data
          docker exec ps-smoke test -f /data/papershelf.db
          echo "✅ SQLite 落在持久化卷上"

      - name: 失败时打印容器日志
        if: failure()
        run: docker logs ps-smoke || true

      - name: 清理
        if: always()
        run: docker rm -f ps-smoke || true

  # ───────────────────────────────────────────────────────────────
  # 5｜断言发布物**在远端真的可解析**（替代原先那个会删包的 cleanup）
  #
  # ⚠️ 这里原本是「删掉按 digest 推送的中间产物标签」的 cleanup（actions/delete-package-versions@v5）。
  #    它在 2026-09-11 的 828114e 那次运行里**把刚发布的镜像自己删空了**：
  #
  #        delete-only-untagged-versions: false    ← 连「有 tag 的版本」一起删
  #        ignore-versions: ^(latest|v?[0-9].*)$   ← 保护名单不含 sha-<commit> / sha256-<hex>
  #        min-versions-to-keep: 0                 ← 一个都不留
  #
  #    时序证据（同一次 run）：merge 推上 latest 并 inspect 成功 → smoke 拉 latest 起容器成功
  #    → cleanup 打印「Total versions deleted till now: 8」→ 此后 GHCR 上 latest / sha-828114e /
  #    manifest digest **全部 404**、包页面显示「No tagged versions found」，部署机 docker pull 只能 not found。
  #
  #    结论（硬约束）：**发布流水线里不允许出现「按版本删包」的步骤**。它的失败模式是
  #    「静默删掉自己刚发布的产物」，而它对交付毫无贡献（只是让 packages 页面好看一点）。
  #    如果将来真要清理，必须：只删能精确匹配 ^sha256-[0-9a-f]{64}$ 的版本、
  #    min-versions-to-keep ≥ 2，并且删完再用 imagetools inspect latest 断言 latest 仍可解析。
  #
  #    现在这一步改成**只读校验**：跑在流水线最后，确认发布物在远端还在、还能解析。
  #    它能抓住的正是上面那类事故（也抓得住"merge 悄悄没推 latest"）。
  # ───────────────────────────────────────────────────────────────
  verify:
    needs: [merge, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 断言 latest 在远端仍可解析
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: 断言按 commit 打的 sha-<短哈希> 标签也在
        run: |
          tag="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"

      - name: 把远端 manifest 写进摘要（便于人工核对架构齐全）
        run: |
          {
            echo "### 发布物校验 ✅"
            echo
            echo '```'
            docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
              | sed -n '/Manifests:/,$p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

