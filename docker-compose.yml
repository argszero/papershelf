# papershelf —— 一条命令起服务
#
#   cp .env.example .env      # 填 PAPERSHELF_SECRET / LLM / 管理员
#   docker compose up -d
#   open http://localhost:8000
#
# 镜像由 GitHub Actions 构建推送到 GHCR（.github/workflows/docker.yml），
# 这里直接拉取即可 —— 部署机不需要 Node/Python 工具链。
# 兼容新旧两代 Docker：`docker compose`（v2 插件）与 `docker-compose`（v1 / 独立安装）都用这份文件。

services:
  papershelf:
    # 想用自己改的源码构建：注释掉 image、放开下面两行
    image: ghcr.io/argszero/papershelf:latest
    # build: .
    # image: papershelf:dev
    container_name: papershelf
    restart: unless-stopped

    # 首次启动的具体步骤见 docs/install.md（含反代与备份）
    env_file:
      - .env
    environment:
      # 容器内固定：数据落卷、监听 0.0.0.0
      PAPERSHELF_DATA_DIR: /data
      PAPERSHELF_HEALTHCHECK_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # SQLite + 原始 PDF + 抽出的图片；**唯一的持久化状态**
      - papershelf-data:/data

    healthcheck:
      test: ["CMD", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # 转换（fitz 解析 + LLM 调用）是内存与 CPU 的短期尖峰。
    #
    # **必须设硬上限**（2026-10-26 生产事故）：没有上限时，容器内失控的内存增长拖死的是
    # 宿主机上**所有**服务 —— 实测一台 1888 MB 的机器上 11 个容器连同 SSH 一起失去响应
    # （TCP 22 可连、sshd 从不 accept），只能控制台重启。有上限时越界的是这一个容器，
    # 至少还能被重启、还能留下日志。
    #
    # 900m 是 2 核 / 2 GB 机器的保守值；内存更大的机器用 PAPERSHELF_MEM_LIMIT 调高。
    # `memswap_limit` 与 `mem_limit` **同值** = 不许拿 swap 兜底；两者不同值时，
    # 内核会以为还有 swap 可用，在零 swap 的机器上表现为"越界很久之后才被杀"。
    mem_limit: ${PAPERSHELF_MEM_LIMIT:-900m}
    memswap_limit: ${PAPERSHELF_MEM_LIMIT:-900m}

    deploy:
      resources:
        reservations:
          memory: 256M      # 只是"预期用量"的声明，不构成任何限制

volumes:
  papershelf-data:
