[project]
name = "papershelf"
version = "0.1.0"
description = "自托管文献精读工作台：PDF/arXiv → 双语对照精读"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "typer>=0.12",
    "httpx>=0.27",
    "pillow>=10.0",
    # 服务端（决策⑨：Python 单体 FastAPI + SQLite）
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",   # 文件上传（⑱ PDF 上传）
    "argon2-cffi>=23.1",         # 密码哈希
    "latex2mathml>=3.77",        # 服务端 LaTeX → MathML（遗留项 8：不依赖任何 CDN）
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[project.scripts]
papershelf = "papershelf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papershelf"]
